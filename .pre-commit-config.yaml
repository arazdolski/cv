---
# Hooks run the project's own ESLint/Prettier from node_modules (pinned by
# pnpm-lock.yaml and bumped by Dependabot), so `pnpm install` must have run.
repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        types_or: [javascript, jsx]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^pnpm-lock\.yaml$
